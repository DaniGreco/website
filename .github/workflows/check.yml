# Cloudflare builds and deploys main after the merge: this checks every pull request before it.
name: Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The oldest Node the site supports (package.json, engines).
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
